services:
  db:
    image: postgres:16
    container_name: NearBite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nearbite
    ports:
      - "5433:5432"
    volumes:
      - recall_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: NearBite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nearbite_redis_data:/data

volumes:
  recall_pgdata:
  nearbite_redis_data: